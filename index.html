const HT={lg:'Finish 1st in your league.',cup:'Win the domestic cup final.',lc:'Win the League Cup final (England, France, Portugal, Scotland).',sc:'Win the league or cup as a Tier 1 club, then win the Super Cup.',cl:'Finish near the top of Tier 1 and win the Champions League.',el:'Qualify for the Europa League and win the final.',ecl:'Qualify for the Conference League and win the final.',wc:'Reach OVR 72 for a call-up, qualify and win the World Cup.',co:'Win the continental championship with your national team.',nl:'Win the Nations League Finals with your national team.',fin:'Win the continental title, then win the Finalissima.',poty:'Average rating 7.5+ over a season.',bd:'Tier 1, average rating 8+ and OVR 80+.'};
const trn=d=>d[0]=='co'?CN2[conf()]:d[2];
function cnt(k){const M2={lg:'lg',cup:'cup',lc:'lc',sc:'sc',wc:'wc',co:'co',nl:'nl',fin:'fin',poty:'poty',bd:'bd'},h=(P.th||[]).filter(x=>x.k==k).length;let o=M2[k]?P.tr[M2[k]]||0:0;if(k=='cl'&&!(P.th||[]).some(x=>x.k=='el'||x.k=='ecl'))o=P.tr.eu||0;return Math.max(h,o)}
function trophy(k){const d=TR.find(x=>x[0]==k),h=(P.th||[]).filter(x=>x.k==k),n=cnt(k),gk=P.pos=='GK'||P.pos=='DEF';$('#tmt').textContent=d[1]+' '+trn(d);
$('#tmb').innerHTML=n?(h.length?h.slice().reverse().map(x=>`<div class='card'><b>${x.s}</b> · ${x.f||''} ${x.c}<br>${x.d}<br><small>Goals ${x.g} · Assists ${x.a}${gk?' · Clean sheets '+x.cs:''} · Average rating ${x.r}</small></div>`).join(''):`<p>${n}×</p><p><small>(details not recorded for earlier wins)</small></p>`):`<p><b>🔒 Locked</b></p><p>${HT[k]}</p>`;$('#tm').classList.remove('hidden')}
function careerScr(){show('table');const av=P.rn?(P.rs/P.rn).toFixed(2):'-',gk=P.pos=='GK'||P.pos=='DEF',rw=(a,b)=>`<div class='row'><span>${a}</span><b>${b}</b></div>`;
$('#table').innerHTML=`<div class='card'><h2>CAREER STATS</h2>${rw('Appearances',P.ap)}${rw('Goals',P.g)}${rw('Assists',P.a)}${gk?rw('Clean sheets',P.cs):''}${rw('Average rating',av)}${rw('Fame',P.fame)}</div><div class='card'><h2>TROPHY CABINET</h2><div class='trg'>${TR.map(d=>{const n=cnt(d[0]);return `<div onclick='trophy("${d[0]}")' style='text-align:center;cursor:pointer;opacity:${n?1:.35}'><div style='font-size:28px'>${d[1]}</div><b>${n}</b><br><small>${trn(d)}</small></div>`}).join('')}</div><p><small>Tap a trophy for its history</small></p></div><div class='card'><h2>TIMELINE</h2>${P.hist.map(h=>`<div>S${h.s}: ${h.c} (${TN[h.t]}) · #${h.p}</div>`).join('')}<div>S${P.season}: ${P.club.n} (${TN[P.club.tier]}) · current</div></div><div class='card'><h2>RECENT MATCHES</h2>${P.mh.length?P.mh.map(m=>`<div>${m}</div>`).join(''):'No matches yet.'}</div><button class='s' onclick='hub()'>← BACK</button>`}
/* ---------- v9: 5 career save slots ---------- */
let AS=-1,NS=0,DEL=-1;
function slots(){try{const a=JSON.parse(localStorage.getItem('pr_slots'));if(Array.isArray(a))return Array.from({length:5},(_,i)=>a[i]||null)}catch(e){}return[null,null,null,null,null]}
function putSlots(s){try{localStorage.setItem('pr_slots',JSON.stringify(s))}catch(e){}}
function migSlots(){try{if(localStorage.getItem('pr_slots')==null){const o=JSON.parse(localStorage.getItem('pr1')),s=[null,null,null,null,null];if(o&&o.P)s[0]={P:o.P,L:o.L,ts:Date.now()};putSlots(s)}}catch(e){}}
const esc=t=>String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function slotsScr(){show('slots');const s=slots();$('#slots').innerHTML=`<div class='card'><h2>CAREER SLOTS</h2></div>`+s.map((x,i)=>{if(!x)return `<div class='card'><h2>Save Slot ${i+1}</h2><p>+ Empty Slot</p><button class='s' onclick='newSlot(${i})'>Start New Career in this Slot</button></div>`;const p=x.P,o=Math.round(Object.values(p.st).reduce((a,b)=>a+b,0)/Object.values(p.st).length),c=(CT[p.club.c]||CT[0])[0];return `<div class='card'><h2>Save Slot ${i+1}${i==AS?' \u2605':''}</h2><div class='row'><b>${esc(p.name)}</b><b class='px' style='background:#ffd23f;color:#222;padding:2px 6px;border-radius:4px;font-size:9px'>${p.pos}</b></div><p style='margin:4px 0'>OVR <b>${o}</b> \u00b7 Age ${p.age} \u00b7 Season ${p.season}<br>${c} ${esc(p.club.n)}<br><small>Saved: ${new Date(x.ts).toLocaleString()}</small></p><div class='ctl'><button onclick='loadSlot(${i})'>Load Career</button><button class='s' onclick='delSlot(${i})'>${DEL==i?'Confirm Delete?':'Delete Save'}</button></div></div>`}).join('')}
function loadSlot(i){const x=slots()[i];if(!x)return;P=x.P;L=x.L;AS=i;DEL=-1;try{localStorage.setItem('pr_active',i)}catch(e){}mig();hub()}
function newSlot(i){NS=i;DEL=-1;show('create')}
function delSlot(i){if(DEL!=i){DEL=i;return slotsScr()}const s=slots();s[i]=null;putSlots(s);if(AS==i){AS=-1;P=null}DEL=-1;slotsScr()}
function resetSave(){if(!confirm('Delete your saved career? This cannot be undone.'))return;if(AS>=0){const s=slots();s[AS]=null;putSlots(s);AS=-1;P=null}$('#modal').classList.add('hidden');slotsScr()}
function impSave(){const s=prompt('Paste save data:');if(!s)return;try{const o=JSON.parse(s);if(!o.P||!o.L)throw 0;const sl=slots();let i=sl.findIndex(x=>!x);if(i<0)i=AS>=0?AS:0;P=o.P;L=o.L;mig();AS=i;save();$('#modal').classList.add('hidden');hub()}catch(e){alert('Invalid save data.')}}
/* ---------- v10: boosters + position offers ---------- */
const CS=[['vit','Isotonic Energy Pack',.05,40,20,0],['spa','Cryotherapy & Spa Session',.10,90,45,10],['gala','Private Weekend Getaway',.15,140,15,30]];
const PG={GK:[['gg','Custom Grip Gloves','s','Handling'],['rp','Reflex Training Light Pods','s','Reflexes'],['pa','Penalty Analyst Tablet','k'],['nk','Neck & Core Mobility Kit','x']],
DEF:[['sg','Carbon-Fiber Shin Guards','s','Tackling'],['tv','Tactical Video Breakdown','x'],['ab','Aerial Leap Resistance Bands','s','Heading'],['hb','Heavy-Duty Studded Boots','s','Strength']],
MID:[['pc','Precision Control Cleats','s','Dribbling'],['vr','Vision & Scanning VR Drill','s','Vision'],['gv','Endurance GPS Vest','s','Stamina'],['ma','Match Tempo Analytics','x']],
FWD:[['sb','Lightweight Speed Boots','s','Pace'],['fv','Finishing VR Simulator','s','Shooting'],['sm','Striker Instinct Masterclass','k'],['ep','Explosive Sprint Parachute','s','Off the Ball']]};
const csP=c=>Math.max(c[3],Math.round(wage()*c[2])),pgPrice=t=>Math.max(60,Math.round(wage()*Math.min(.3,({s:.08,x:.1,k:.12})[t]+.03*((P.pgc||{})[t]||0))));
function pgRoll(){const a=[...PG[P.pos]];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}P.po={w:P.wk||0,i:a.slice(0,3).map(x=>x[0]),b:[]}}
function pgList(){if(!P.po||(P.wk||0)-P.po.w>=4||!P.po.i.every(id=>PG[P.pos].some(x=>x[0]==id)))pgRoll();return P.po.i.map(id=>PG[P.pos].find(x=>x[0]==id))}
function shopX(){const o=pgList(),rf=Math.max(50,Math.round(wage()*.05));
return `<h2 style='margin-top:10px'>BOOSTERS</h2>`+CS.map(c=>{const p=csP(c);return `<button class='s' ${P.money<p?'disabled':''} onclick='buyC("${c[0]}")'>${c[1]}<br><small>£${p.toLocaleString()} · ${[c[4]?'Energy +'+c[4]+'%':'',c[5]?'Mood +'+c[5]+'%':''].filter(Boolean).join(' · ')}</small></button>`}).join('')
+`<h2 style='margin-top:10px'>Special Offers for Your Position</h2>`+o.map(x=>{const p=pgPrice(x[2]),sd=P.po.b.includes(x[0]),ef=x[2]=='s'?'+1 '+x[3]:x[2]=='x'?'+5% XP':'Key moments +2';return `<button class='s' ${sd||P.money<p?'disabled':''} onclick='buyG("${x[0]}")'>${x[1]}<br><small>${sd?'SOLD':'£'+p.toLocaleString()} · ${ef}</small></button>`}).join('')
+`<button class='s' ${P.money<rf?'disabled':''} onclick='pgRef()'>REFRESH OFFERS<br><small>£${rf.toLocaleString()}</small></button>`}
function buyC(id){const c=CS.find(x=>x[0]==id),p=csP(c);if(P.money<p)return;P.money-=p;P.en=cl(P.en+c[4],0,100);P.mb=(P.mb||0)+c[5];moodCalc();save();shopScr()}
function buyG(id){const x=PG[P.pos].find(y=>y[0]==id);if(!x||P.po.b.includes(id))return;const p=pgPrice(x[2]);if(P.money<p)return;P.money-=p;
if(x[2]=='s')P.st[x[3]]=Math.min(99,P.st[x[3]]+1);else if(x[2]=='x')P.xpb=Math.min(.25,(P.xpb||0)+.05);else P.kmb=Math.min(8,(P.kmb||0)+2);
P.pgc[x[2]]=(P.pgc[x[2]]||0)+1;P.po.b.push(id);save();shopScr()}
function pgRef(){const rf=Math.max(50,Math.round(wage()*.05));if(P.money<rf)return;P.money-=rf;pgRoll();save();shopScr()}

migSlots();initLang();initScr();
